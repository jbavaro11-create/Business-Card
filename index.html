<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jake Bavaro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0f1f38;
      --gold: #c9a96e;
      --gold-light: #e8d5b0;
      --text-muted: #8a9ab5;
    }
    html, body {
      min-height: 100%;
      font-family: 'DM Sans', sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: 24px 16px;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, #1e3560 0%, transparent 70%),
                  radial-gradient(ellipse 50% 40% at 80% 80%, #0d1a30 0%, transparent 60%),
                  #0f1f38;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(160deg, #1c2f4a 0%, #0f1f38 60%);
      border: 1px solid rgba(201,169,110,0.25);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04) inset;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.1s forwards;
    }
    @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }
    .card::before {
      content: '';
      display: block;
      height: 3px;
      background: linear-gradient(90deg, transparent, #c9a96e, transparent);
    }
    .photo-wrap {
      position: relative;
      width: 100%;
      height: 320px;
      overflow: hidden;
    }
    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 15%;
      transform: scale(0.82);
      transform-origin: center top;
      display: block;
    }
    .photo-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 40%, #0f1f38 100%);
    }
    .body { padding: 0 28px 28px; }
    .name-block { margin-bottom: 20px; }
    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.1rem;
      font-weight: 600;
      line-height: 1.1;
      color: #fff;
    }
    .credentials {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 300;
      color: #c9a96e;
      letter-spacing: 0.12em;
      margin-top: 4px;
    }
    .title {
      font-size: 0.78rem;
      font-weight: 400;
      color: #8a9ab5;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 6px;
    }
    .divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, #c9a96e, transparent);
      margin: 20px 0;
    }
    .contacts {
      display: flex;
      flex-direction: column;
      gap: 13px;
      margin-bottom: 28px;
    }
    .contact-row {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
      transition: color 0.2s;
    }
    .contact-row:hover { color: #e8d5b0; }
    .icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(201,169,110,0.1);
      border: 1px solid rgba(201,169,110,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .contact-row:hover .icon { background: rgba(201,169,110,0.18); }
    .icon svg { width: 16px; height: 16px; fill: #c9a96e; }
    .contact-text { font-size: 0.875rem; font-weight: 300; letter-spacing: 0.02em; }
    .socials { display: flex; gap: 10px; margin-bottom: 28px; }
    .social-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 10px;
      border: 1px solid rgba(201,169,110,0.25);
      background: rgba(255,255,255,0.03);
      text-decoration: none;
      color: #8a9ab5;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .social-btn:hover {
      color: #e8d5b0;
      border-color: rgba(201,169,110,0.5);
      background: rgba(201,169,110,0.07);
    }
    .social-btn svg { width: 15px; height: 15px; fill: currentColor; }

    .services { margin-bottom: 4px; }
    .services-label {
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #c9a96e;
      margin-bottom: 12px;
    }
    .services-list { display: flex; flex-direction: column; gap: 10px; }
    .service-row { display: flex; align-items: center; gap: 10px; }
    .service-dot { color: #c9a96e; font-size: 1.1rem; line-height: 1; }
    .service-en { font-size: 0.95rem; font-weight: 300; color: #e8d5b0; letter-spacing: 0.04em; }
    .save-btn {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #c9a96e 0%, #a07c45 100%);
      color: #0f1f38;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      box-shadow: 0 4px 20px rgba(201,169,110,0.3);
    }
    .save-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .save-btn:active { transform: translateY(0); }
  </style>
</head>
